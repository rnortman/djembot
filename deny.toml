# cargo-deny policy: `cargo deny check licenses`.

[licenses]
version = 2

# OFL-1.1, Ubuntu-font-1.0 and the LLVM exception come from the default fonts
# egui embeds in the binary; both font licenses permit that redistribution.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
